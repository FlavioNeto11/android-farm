name: Sugerir uma melhoria
description: Proponha uma melhoria para o projeto.
title: "[Melhoria]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Não inclua credenciais, tokens, chaves ou dados pessoais. Sugestões devem respeitar os termos e mecanismos de segurança das plataformas integradas."
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Que necessidade esta sugestão atende?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução sugerida
      description: Descreva o resultado desejado.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
