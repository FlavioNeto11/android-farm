# Android Farm Configuration
# Copy this to .env and update with your values

server:
  host: "0.0.0.0"
  port: 8000
  debug: false

database:
  url: "sqlite+aiosqlite:///./data/farm.db"

secret_store:
  key_file: "./data/secret.key"
  storage_path: "./data/secrets/"

proxy:
  pool_size: 10
  rotation_strategy: "round_robin"
  # Proxy sources: list, api, file
  # sources:
  #   - type: list
  #     proxies:
  #       - host: proxy.example.com
  #         port: 8080
  #         username: user
  #         password: pass
  #   - type: file
  #     path: ./proxies.txt

browser:
  headless: true
  anti_detect: true
  # User agents (will be populated auto if empty)
  user_agents:

platforms:
  outlook:
    enabled: true
    signup_url: "https://signup.live.com"
    account_age_days: 365
    timeout: 60
  instagram:
    enabled: true
    signup_url: "https://www.instagram.com/accounts/emailsignup/"
    account_age_days: 365
    timeout: 90

abuse_protection:
  rate_limit_per_minute: 5
  max_wait_seconds: 300
  retry_attempts: 3

logging:
  level: "INFO"
  file: "./logs/farm.log"
  max_size_mb: 10
  backup_count: 5
